# Runs on every pull request and on main. A green check means: the code lints,
# types check, the safety tests pass, no photo leaks location or skips consent,
# the story bank is consistent, and the site builds.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Photo safety
        run: npm run photos:check
      - name: Story bank
        run: npm run storybank:lint
      - name: Build
        run: npm run build
